if(U.tab==="cont")l=l.filter(i=>isS(i)&&status(i)===1);if(U.tab==="todo")l=l.filter(i=>S.todo[i[0]]);if(U.tab==="fav")l=l.filter(i=>S.fav[i[0]]);if(U.tab==="prox")l=ord().filter(i=>i[10]==="p");if(U.tab==="opt")l=l.filter(i=>i[8]===0&&i[10]!=="p");
const lm=U.tab==="todo"?l.reduce((a,i)=>a+mins(i)-minsSeen(i),0):0;
const chips=(k,o)=>`<div class="chips">${o.map(x=>`<button class="chip ${String(U[k])===String(x[0])?"on":""}" data-a="chip" data-k="${k}" data-i="${x[0]}">${x[1]}</button>`).join("")}</div>`,nf=["cat","ph","im"].filter(k=>U[k]!=="").length+(S.hide?1:0);
const sel=(k,o,t)=>`<select data-f="${k}" aria-label="${t}"><option value="">${t}</option>${o.map(x=>`<option value="${x[0]}" ${String(U[k])===String(x[0])?"selected":""}>${x[1]}</option>`).join("")}</select>`;
const tabs=[["all","🎬 Catálogo"],["cont","▶️ Continuar viendo"],["todo","🍿 Mi lista / Maratón"],["fav","⭐ Favoritos"],["opt","🧩 Opcional"],["prox","🔜 Próximos estrenos"],["ph","📊 Fases"]];
const x=document.getElementById("app");x.innerHTML=`${err?`<div class="box" role="alert" style="border-color:var(--red)">${err}</div>`:""}
<div class="box"><div class="mu">UCM principal</div><b style="font-size:28px;color:var(--gold)">${pc(A.dn,A.all)}%</b> completado<div class="bar"><i style="width:${pc(A.dn,A.all)}%"></i></div>
<div class="st"><div><b>${A.fs}/${A.f}</b><span>películas vistas (${A.f-A.fs} pendientes)</span></div><div><b>${A.sd}</b><span>series completadas · ${A.sv} en curso</span></div><div><b>${A.ts}</b><span>temporadas completas</span></div><div><b>${A.es}</b><span>episodios vistos</span></div><div><b>${fmt(A.ms)}</b><span>tiempo visto</span></div><div><b>${fmt(A.m-A.ms)}</b><span>tiempo restante (estimado)</span></div></div>
<p class="mu">Marvel TV y otros universos: ${O.dn}/${O.all}. Tiempos estimados.</p></div>
<div class="box"><b>🍿 ¿Qué veo ahora?</b> ${rc?`<p><span style="color:var(--gold)">${rc[1]}</span> <span class="mu">(${TY[rc[4]]}${status(rc)===1?" · en curso":""})</span></p><div class="row"><button data-a="next">Ver siguiente recomendación</button><button data-a="go" data-i="${rc[0]}">Ir a la ficha</button><label><input type="checkbox" data-a="opt" ${S.opt?"checked":""}> Incluir opcionales</label></div>`:"<p>¡Has completado todo lo recomendado del UCM!</p>"}</div>
<div class="row"><button class="${S.mode==="cr"?"on":""}" data-a="mode" data-i="cr">⏳ Orden cronológico</button><button class="${S.mode==="re"?"on":""}" data-a="mode" data-i="re">🎟️ Orden de estreno</button><span class="mu">${S.mode==="cr"?"Cronología aproximada":"Fechas internacionales"}</span></div>
<div class="chips">${tabs.map(t=>`<button class="chip ${U.tab===t[0]?"on":""}" data-a="tab" data-i="${t[0]}">${t[1]}</button>`).join("")}</div>
${U.tab==="ph"?`<div class="box">${[1,2,3,4,5,6].map(p=>bars("Fase "+p,u.filter(i=>i[5]===p))).join("")}${bars(SAGA(1),u.filter(i=>i[5]<=3))}${bars(SAGA(4),u.filter(i=>i[5]>3))}</div>`:`
<div class="box"><div class="row"><input type="search" data-f="q" placeholder="🔍 Buscar título…" value="${U.q}" aria-label="Buscar" style="flex:1;min-width:0"><button data-a="undo" ${H.length?"":"disabled"} aria-label="Deshacer">↶ Deshacer</button></div>${chips("st",[["","Todos"],[0,"⚪ Pendientes"],[1,"👀 Viendo"],[2,"✅ Vistos"]])}${chips("ty",[["","Todo"],["f","🎬 Películas"],["s","📺 Series"],["a","✨ Animación"]])}<details data-id="flt" ${U.o.flt?"open":""}><summary>🎛️ Más filtros${nf?" ("+nf+")":""}</summary><div class="fg">${sel("cat",[["u","UCM principal"],["t","Marvel TV"],["o","Otros universos"]],"Categoría")}${sel("ph",[1,2,3,4,5,6].map(p=>[p,"Fase "+p]),"Fase")}${sel("im",[[2,"Imprescindible"],[1,"Recomendable"],[0,"Opcional"]],"Relevancia")}<label><input type="checkbox" data-a="hide" ${S.hide?"checked":""}> Ocultar vistos</label><label><input type="checkbox" data-a="sim" ${S.sim?"checked":""}> Modo simple (sin episodios)</label><button data-a="clr">🧹 Limpiar filtros</button></div></details></div>
<details><summary>Criterio de relevancia</summary><p class="mu">Criterio propio, no oficial de Marvel. Imprescindible = trama principal; Recomendable = aporta contexto; Opcional = complementario.</p></details>${U.tab==="todo"?`<p>Tiempo restante de tu lista: <b>${fmt(lm)}</b> (para planificar sesiones).</p>`:""}</div>
<div class="grid">${l.map(card).join("")||'<p class="mu">Sin resultados con estos filtros.</p>'}</div>`}
<div class="box" style="margin-top:14px"><b>Tu progreso</b><p class="mu">Se guarda automáticamente en este navegador (localStorage). No se sincroniza entre dispositivos ni sobrevive a borrar los datos del navegador: para cambiar de dispositivo, exporta y pega/importa el JSON.</p>
<div class="row"><button data-a="exp">Exportar JSON</button><button data-a="imp">Importar JSON pegado</button><input type="file" accept=".json" data-a="file" aria-label="Importar archivo JSON"><button data-a="reset">${resetArm?"¿Seguro? Pulsa otra vez para borrar todo":"Reiniciar progreso"}</button></div><textarea id="io" aria-label="JSON de progreso" placeholder="Aquí aparece tu JSON; pega uno para importarlo"></textarea></div>`}
// ===== EVENTOS =====
const io=()=>document.getElementById("io");
function doImp(t){try{const d=JSON.parse(t);if(typeof d!=="object"||!d.w||!d.e)throw 0;mut(()=>{S.w=d.w;S.e=d.e;S.fav=d.fav||{};S.todo=d.todo||{}});err=""}catch(x){err="JSON no válido: no se ha cambiado tu progreso.";render()}}
document.addEventListener("change",ev=>{const t=ev.target,a=t.dataset.a,i=t.dataset.i,it=C.find(x=>x[0]===i);
if(t.dataset.f){U[t.dataset.f]=t.value;return render()}
if(a==="w")mut(()=>{t.checked?S.w[i]=1:delete S.w[i]});
else if(a==="s")mut(()=>setS(it,+t.dataset.s,t.checked));
else if(a==="e")mut(()=>{const k=ek(i,+t.dataset.s,+t.dataset.e);t.checked?S.e[k]=1:delete S.e[k]});
else if(a==="hide"||a==="sim"||a==="opt"){S[a]=t.checked;save();render()}
else if(a==="file"&&t.files[0]){const r=new FileReader();r.onload=()=>doImp(r.result);r.onerror=()=>{err="No se pudo leer el archivo.";render()};r.readAsText(t.files[0])}});
document.addEventListener("input",ev=>{if(ev.target.dataset.f==="q"){U.q=ev.target.value;const p=ev.target.selectionStart;render();const q=document.querySelector('[data-f=q]');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;const a=b.dataset.a,i=b.dataset.i;
if(a==="mode"){S.mode=i;save();render()}else if(a==="tab"){U.tab=i;render()}
else if(a==="chip"){U[b.dataset.k]=b.dataset.i;render()}else if(a==="eb")mut(()=>{const k=ek(i,+b.dataset.s,+b.dataset.e);S.e[k]?delete S.e[k]:S.e[k]=1});else if(a==="wb")mut(()=>{S.w[i]?delete S.w[i]:S.w[i]=1});else if(a==="fav"||a==="todo")mut(()=>{S[a][i]?delete S[a][i]:S[a][i]=1});
else if(a==="next"){U.ri++;render()}
else if(a==="go"){U.tab="all";U.q=U.ty=U.cat=U.ph=U.st=U.im="";S.hide=false;render();const c=document.getElementById("c-"+i);if(c){c.scrollIntoView({behavior:"smooth",block:"center"});c.classList.add("flash");setTimeout(()=>c.classList.remove("flash"),2000)}}
else if(a==="clr"){U.q=U.ty=U.cat=U.ph=U.st=U.im="";render()}
else if(a==="undo"&&H.length){const p=JSON.parse(H.pop());Object.assign(S,p);save();render()}
else if(a==="exp"){render();io().value=JSON.stringify({app:"marvel-tracker",v:1,w:S.w,e:S.e,fav:S.fav,todo:S.todo},null,1);io().select()}
else if(a==="imp"){doImp(io().value)}
else if(a==="reset"){if(resetArm){resetArm=false;mut(()=>{S.w={};S.e={};S.fav={};S.todo={}})}else{resetArm=true;render()}}});
document.addEventListener("toggle",e=>{const d=e.target;if(d.tagName==="DETAILS"&&d.dataset.id)U.o[d.dataset.id]=d.open},true);
render();
</script></body></html>
